<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - ISIRI Seeds Production</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation bar --
    <header>
        <div class="header-inner" style="width:100%;max-width:1200px;display:flex;align-items:center;justify-content:space-between;">
    <a href="/" class="logo">Isiri Seeds Production</a>

    <!-- Desktop nav (unchanged) -->
    <nav class="main-nav">
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>

    <!-- Hamburger - visible on mobile only -->
    <button id="menuToggle" class="hamburger" aria-label="Open menu" aria-expanded="false">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div
    </header>
    <div class="menu-overlay" id="menuOverlay" hidden></div>
    <aside class="mobile-menu" id="mobileMenu" aria-hidden="true" role="dialog" aria-label="Mobile menu">
        <button id="menuClose" class="menu-close" aria-label="Close menu">&times;</button>
        <nav class="mobile-nav" aria-label="Mobile navigation">
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </aside>


    <!-- Gallery section -->
    <section class="features" id="gallery">
        <h2>Gallery</h2>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="slide2.jpg" alt="Seedlings and trays with blue crates in a greenhouse">
            </div>
            <div class="gallery-item">
                <img src="slide3.jpg" alt="Pepper plants growing under protective netting">
            </div>
            <div class="gallery-item">
                <img src="slide4.jpg" alt="Young pepper plants planted in rows on farmland">
            </div>
        </div>
    </section>
</body>
</html>
